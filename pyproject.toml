[project]
name = "wxread-control-panel"
version = "0.1.0"
description = "LAN control panel for wxread automation"
requires-python = ">=3.10"
dependencies = [
    "apscheduler>=3.10.4",
    "flask>=3.0.0",
    "playwright>=1.49.0",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
